name: Impacto host tools

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check source and candidate gates
        run: |
          python tools/impacto/check-host-manifest.py
          python tools/impacto/test-check-host-manifest.py
          python tools/impacto/test-upstream-integrity.py
          python tools/impacto/test-patch-series.py
          python tools/impacto/test-git-environment.py
          python tools/impacto/test-build-preflight.py
          python tools/impacto/test-stage-upstream.py
          python tools/impacto/test-profiles.py
          bash -n tools/impacto/build-tools.sh
          bash -n tools/impacto/build-upstream.sh
          bash -n tools/impacto/dev-build.sh
          bash tools/impacto/test-build-tools.sh
      - name: Apply the locked patch series to the pinned upstream revision
        run: |
          rev=$(python -c "import json;print(json.load(open('engine/impacto/source-lock.json'))['impacto']['revision'])")
          git init -q "$RUNNER_TEMP/impacto-source"
          git -C "$RUNNER_TEMP/impacto-source" config core.autocrlf false
          git -C "$RUNNER_TEMP/impacto-source" fetch -q --depth 1 https://github.com/CommitteeOfZero/impacto.git "$rev"
          git -C "$RUNNER_TEMP/impacto-source" checkout -q --detach "$rev"
          python tools/impacto/apply-patches.py --source "$RUNNER_TEMP/impacto-source" --report "$RUNNER_TEMP/patches-applied.json"
          python tools/impacto/verify-upstream.py --patched --source "$RUNNER_TEMP/impacto-source"
          python tools/impacto/test-profiles.py --source "$RUNNER_TEMP/impacto-source"
      - name: Check dependency pinning without downloads
        run: |
          cmake -S tools/impacto/tests/pins -B "$RUNNER_TEMP/impacto-pins" \
            -DCMAKE_PROJECT_impacto_INCLUDE="$GITHUB_WORKSPACE/engine/impacto/host-build/pin-dependencies.cmake" \
            -DTYRANOR_IMPACTO_SOURCE_LOCK="$GITHUB_WORKSPACE/engine/impacto/source-lock.json"
      - name: Install the pinned NDK and CMake (stdout must be eval-safe)
        run: |
          # The release workflow evals this script's stdout, so anything but export lines on stdout breaks it.
          out=$(bash tools/impacto/setup-linux-tools.sh)
          [[ $(printf '%s\n' "${out}" | wc -l) == 2 ]] || { echo "::error::unexpected stdout: ${out}"; exit 1; }
          eval "${out}"
          test -f "${ANDROID_NDK_HOME}/source.properties"
          "${IMPACTO_CMAKE}" --version | head -1
